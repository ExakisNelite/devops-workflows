name: Reusable Teams Notification Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (dev/prod)'
        required: true
        type: string
      status:
        description: 'Deployment status (success/failure/started)'
        required: true
        type: string
      deployment-url:
        description: 'URL of the deployed application'
        required: false
        type: string
        default: ''
      component:
        description: 'Component being deployed (backend/frontend/complete)'
        required: false
        type: string
        default: 'application'
    secrets:
      TEAMS_WEBHOOK_URL:
        description: 'Microsoft Teams webhook URL'
        required: true

permissions:
  contents: read

jobs:
  notify:
    name: Send Teams Notification
    runs-on: ubuntu-latest
    steps:
      - name: Set notification color
        id: color
        run: |
          if [ "${{ inputs.status }}" == "success" ]; then
            {
              echo "color=00FF00"
              echo "icon=✅"
              echo "title=Deployment Successful"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.status }}" == "failure" ]; then
            {
              echo "color=FF0000"
              echo "icon=❌"
              echo "title=Deployment Failed"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "color=0078D4"
              echo "icon=🚀"
              echo "title=Deployment Started"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build Teams message
        id: message
        run: |
          # Create message body
          cat > message.json <<EOF
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "${{ steps.color.outputs.icon }} ${{ steps.color.outputs.title }}",
            "themeColor": "${{ steps.color.outputs.color }}",
            "title": "${{ steps.color.outputs.icon }} NewTSP Deployment - ${{ inputs.environment }}",
            "sections": [
              {
                "activityTitle": "${{ steps.color.outputs.title }}",
                "activitySubtitle": "Environment: **${{ inputs.environment }}**",
                "facts": [
                  {
                    "name": "Component:",
                    "value": "${{ inputs.component }}"
                  },
                  {
                    "name": "Status:",
                    "value": "${{ inputs.status }}"
                  },
                  {
                    "name": "Triggered by:",
                    "value": "${{ github.actor }}"
                  },
                  {
                    "name": "Branch:",
                    "value": "${{ github.ref_name }}"
                  },
                  {
                    "name": "Commit:",
                    "value": "${{ github.sha }}"
                  },
                  {
                    "name": "Workflow:",
                    "value": "${{ github.workflow }}"
                  }
                ],
                "markdown": true
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "View Workflow Run",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              },
              {
                "@type": "OpenUri",
                "name": "View Commit",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
                  }
                ]
              }
          EOF

          # Add deployment URL if provided
          if [ -n "${{ inputs.deployment-url }}" ]; then
            cat >> message.json <<EOF
              ,
              {
                "@type": "OpenUri",
                "name": "Open Application",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ inputs.deployment-url }}"
                  }
                ]
              }
          EOF
          fi

          # Close the JSON
          cat >> message.json <<EOF
            ]
          }
          EOF

          # Output for debugging
          echo "Generated Teams message:"
          cat message.json

      - name: Send notification to Teams
        run: |
          curl -X POST \
            -H 'Content-Type: application/json' \
            -d @message.json \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"

      - name: Verify notification sent
        if: always()
        run: |
          # Note: This step runs after curl, but $? reflects the success of this step's script
          # The actual notification status is checked by the workflow's job status
          echo "✅ Notification step completed"
